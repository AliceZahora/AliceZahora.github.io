<!DOCTYPE html>
<html lang="en">
    <head>
        <!--

        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <meta name="description" content="Web 200 - Assignment 8">
        <link rel="stylesheet" href="assignment8.css" type="text/css">
        <script src="assignment8.js" defer></script>
        <link rel="preconnect" href="https://fonts.googleapis.com">
        <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
        <link href="https://fonts.googleapis.com/css2?family=Share+Tech" rel="stylesheet">
        <script src="https://kit.fontawesome.com/e558e0301a.js" crossorigin="anonymous"></script>
        <title> Web 200 - Zahora 8 </title>
        <!--
            INSTRUCTIONS

            - Required
                Use a standard for loop to iterate and render a list of items onto the page.
                Use nested for loop to generate a multiplication table in HTML
            - Extra Credit
                Use the dataset in the attached file
                Using for...of: Display the make, model, and year of every car in your HTML
                Using for...in: Display every property name and its value for the first car in the array.

        -->
    </head>
    <body id="body">
        <header id="header">
            <h1> Web 200 </h1>
            <h2> Assignment 8 </h2>
        </header>
        <main id="main">
            <fieldset id="modeContainer">
                <legend id="legend"> Choose Mode </legend>
                <label for="studyMode" class="label"> Study
                    <input type="radio" id="studyMode" name="modeType" class="modeInput" value="study" checked>
                </label>
                <label for="raceMode" class="label"> Cars
                    <input type="radio" id="raceMode" name="modeType" class="modeInput" value="race">
                </label>
            </fieldset>
            <div id="multContainer">
                <h3 id="tableHeader" class="h3"> Multiplication Table </h3>
                <label for="inputField"> Enter Size </label>
                <input type="number" min="1" max="100" id="inputField" class="userInput">
            </div>
            <div id="carContainer">
                <h3 id="carHeader" class="h3"> Car Garage </h3>
                <p> Click whitespace to expand </p>
                <div id="carCard"></div>
            </div>
            <div id="raceContainer">
                <div id="duringRace">
                    <h3 class="h3"> Answer Questions and Beat Your Opponents! </h3>
                    <p> Press [Enter] or Submit Button to answer </p>
                    <p id="mathQuestion"> 13 x 16 ? </p>
                    <label for="mathAnswer"> Answer: </label>
                    <input type="number" id="mathAnswer" class="userInput" autofocus>
                    <input type="button" value="Submit" id="submitButton" class="gameButton">
                </div>
                <div id="afterRace">
                    <h3 class="h3" id="endText"> You Finished! </h3>
                    <label for="playAgin"></label>
                    <input type="button" value="Play Again" id="playAgain" class="gameButton">
                </div>
                <div id="racetrack">
                    <div id="road">
                        <div id="lane1" class="lane">
                            <i id="playerCar" class="fa-solid fa-car-side"></i>
                        </div>
                        <div id="lane2" class="lane">
                            <i class="fa-solid fa-car-side"></i>
                        </div>
                        <div id="lane3" class="lane">
                            <i class="fa-solid fa-car-side"></i>
                        </div>
                        <div id="lane4" class="lane">
                            <i class="fa-solid fa-car-side"></i>
                        </div>
                        <div id="lane5" class="lane">
                            <i class="fa-solid fa-car-side"></i>
                        </div>
                    </div>
                    <div id="finishLine">
                        <i class="fa-solid fa-flag-checkered"></i>
                    </div>
                </div>
            </div>
        </main>
    </body>
</html>
