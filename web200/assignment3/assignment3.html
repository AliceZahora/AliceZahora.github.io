        <title> Web 200 - Zahora 3 </title>
        <!--
        INSTRUCTIONS
            - Build a simple unit converter (i.e.: miles -> kilometers or
              km -> mi, Farenheigh <->Celsius) using arithmetic operators and expressions.
                Display the original value (you can make up a value and display it)
                Display the converted value on the page.
            - For miles <-> kilometers
                Display original value that you pick: i.e. 6 miles
                execute expression with arithmetic (value * 1.609 = kilometers) and
                display resulting value in kilometers.
        -->
    </head>
    <body>
        <header>
            <h1> Web 200 </h1>
            <h2> Assign 3 </h2>
        </header>
        <main>
            <i class="fa-solid fa-sun"></i>
            <div id="forecast">
                <i class="fa-solid fa-temperature-high"></i>
                <div id="tempAdjust">
                    <div id="temp">
                        <textarea id="tempNum"></textarea>
                        <p id="tempType"> &degF </p>
                    </div>
                    <button id="tempButton" onclick="tempConvert()"> Change To &degC </button>
                </div>
            </div>
            <div id="roadLines">
                <div id="car">
                    <i class="fa-solid fa-car-side"></i>
                    <i class="fa-solid fa-gauge-high"></i>
                    <div id="speedAdjust">
                        <div id="speed">
                            <textarea id="speedNum"></textarea>
                            <p id="speedType">mph</p>
                        </div>
                        <button id="speedButton" onclick="speedConvert()"> Change to km </button>
                    </div>
                </div>
            </div>
        </main>
    </body>
