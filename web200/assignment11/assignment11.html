<!DOCTYPE html>
<html lang="en">
    <head>
        <!--
            Alice Zahora
            Class: Web 200
            Assignment: 11
            Date: 11/22/2026
        -->
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <meta name="description" content="Web 200 - Assignment 11">
        <link rel="stylesheet" href="assignment11.css" type="text/css">
        <script src="assignment11.js" defer></script>
        <title> Web 200 - Zahora 11 </title>
        <!--
            INSTRUCTIONS

            Build a registration or contact form with thorough client-side validation:
            required fields, email format, a password with minimum length and complexity,
            and a matching confirm-password field. Show clear, inline error messages next to
            each field — not alerts. Form should only "submit" (display a success message) when all validations pass.

            Include:

            First name
            last name
            phone #
            email
            address
            password
            confirm password

            use HTML placeholder text, inline alerts when validation fails
        -->
    </head>
    <body id="body">
        <header id="header">
            <h1> Web 200 </h1>
            <h2> Assignment 11 </h2>
        </header>
        <main id="main">
            <form method="post">
                <fieldset>
                    <legend> Personal Details </legend>
                    <div id="fullName">
                        <label for="fname"> First Name
                            <input type="text" name="fname" id="fname" autocomplete="given-name">
                        </label>
                        <label for="lname"> Last Name
                            <input type="text" name="lname" id="lname" autocomplete="family-name">
                        </label>
                    </div>
                    <div id="fullAdress">
                        <label for="addrLine"> Address
                            <input type="text" name="addrLine" id="addrLine" autocomplete="address-line1">
                        </label>
                        <div class="flexRow">
                            <label for="country"> Country
                                <input type="text" name="country" id="country" autocomplete="country">
                            </label>
                            <label for="city"> City
                                <input type="text" name="city" id="city" autocomplete="address-level2">
                            </label>
                            <label for="state"> State
                                <select name="state" name="state" id="state" autocomplete="address-level1"></select>
                            </label>
                            <label for="zip"> Zip
                                <input type="num" name="zip" id="zip" max="5" autocomplete="postal-code">
                            </label>
                        </div>
                    </div>
                </fieldset>
                <fieldset>
                    <legend> Contact Information </legend>
                    <label for="email"> Email
                        <input type="email" name="email" id="email" autocomplete="email">
                    </label>
                    <label for="phone"> Phone Number
                        <input type="tel" name="phone" id="phone" autocomplete="tel">
                    </label>
                </fieldset>
                <fieldset>
                    <legend> Account Security </legend>
                    <label for="passOG"> Password
                        <input type="password" name="passOG" id="passOG" autocomplete="new-password">
                    </label>
                    <label for="passConfirm"> Confirm Password
                      <input type="password" name="passConfirm" id="passConfirm" autocomplete="new-password">
                    </label>
                </fieldset>
            </form>
        </main>
    </body>
</html>
