<!DOCTYPE html>
<html lang="en">
    <head>
        <!--
            Alice Zahora
            Class: Web 200
            Assignment: 11
            Date: 11/22/2026
        -->
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <meta name="description" content="Web 200 - Assignment 11">
        <link rel="stylesheet" href="assignment11.css" type="text/css">
        <script src="assignment11.js" defer></script>
        <title> Web 200 - Zahora 11 </title>
        <!--
            INSTRUCTIONS

            Build a registration or contact form with thorough client-side validation:
            required fields, email format, a password with minimum length and complexity,
            and a matching confirm-password field. Show clear, inline error messages next to
            each field — not alerts. Form should only "submit" (display a success message) when all validations pass.

            Include:

            First name
            last name
            phone #
            email
            address
            password
            confirm password

            use HTML placeholder text, inline alerts when validation fails
        -->
    </head>
    <body id="body">
        <header id="header">
            <h1> Web 200 </h1>
            <h2> Assignment 11 </h2>
        </header>
        <main id="main">
            <div id="wrapper">
                <form method="post" id="fullForm">
                    <h3 id="formTitle"> Contact Form </h3>
                    <fieldset id="personalInfo" class="formFieldset">
                        <legend> Personal Details </legend>
                        <div class="groupedInputs">
                            <div>
                                <label for="fname"> First Name </label>
                                <input type="text" name="fname" id="fname" autocomplete="given-name" placeholder="John" pattern="^[A-Za-z ]{1,}(?:-[A-Za-z ]{1,}|$)" required>
                            </div>
                            <div>
                                <label for="middleInitial"> MI </label>
                                <input type="text" name="middleInitial" id="middleInitial" class="flexrowShort" autocomplete="additional-name" placeholder="D" pattern="[A-Za-z]{1}" maxlength="1">
                            </div>
                            <div>
                                <label for="lname"> Last Name </label>
                                <input type="text" name="lname" id="lname" autocomplete="family-name" placeholder="Doe" pattern="^[A-Za-z ]{1,}(?:-[A-Za-z ]{1,}|$)" required>
                            </div>
                        </div>
                        <label for="addrLine"> Address </label>
                        <input type="text" name="addrLine" id="addrLine" class="inputBoxLong" autocomplete="address-line1" placeholder="123 Sample Street" required>
                        <div class="groupedInputs">
                            <div>
                                <label for="country"> Country </label>
                                <input type="text" name="country" id="country" autocomplete="country" pattern="[A-Za-z ]{2,}" placeholder="Country" required>
                            </div>
                            <div>
                                <label for="city"> City </label>
                                <input type="text" name="city" id="city" autocomplete="address-level2"  pattern="[A-Za-z ]{2,}" placeholder="City" required>
                            </div>
                            <div id="stateDiv">
                                <label for="state"> State </label>
                                <select name="state" name="state" id="state" class="flexrowShort" autocomplete="address-level1" required>
                                    <option value="alabama"> AL </option>
                                    <option value="alaska"> AK </option>
                                    <option value="arizona"> AZ </option>
                                    <option value="arkansas"> AR </option>
                                    <option value="california"> CA </option>
                                    <option value="colorado"> CO </option>
                                    <option value="connecticut"> CT </option>
                                    <option value="delaware"> DE </option>
                                    <option value="florida"> FL </option>
                                    <option value="georgia"> GA </option>
                                    <option value="hawaii"> HI </option>
                                    <option value="idaho"> ID </option>
                                    <option value="illinois"> IL </option>
                                    <option value="indiana"> IN </option>
                                    <option value="iowa"> IA </option>
                                    <option value="kansas"> KS </option>
                                    <option value="kentucky"> KY </option>
                                    <option value="louisiana"> LA </option>
                                    <option value="maine"> ME </option>
                                    <option value="maryland"> MD </option>
                                    <option value="massachusetts"> MA </option>
                                    <option value="michigan"> MI </option>
                                    <option value="minnesota"> MN </option>
                                    <option value="mississippi"> MS </option>
                                    <option value="missouri"> MO </option>
                                    <option value="montana"> MT </option>
                                    <option value="nebraska"> NE </option>
                                    <option value="nevada"> NV </option>
                                    <option value="newHampshire"> NH </option>
                                    <option value="newJersey"> NJ </option>
                                    <option value="newMexico"> NM </option>
                                    <option value="newYork"> NY </option>
                                    <option value="northCarolina"> NC </option>
                                    <option value="northDakota"> ND </option>
                                    <option value="ohio"> OH </option>
                                    <option value="oklahoma"> OK </option>
                                    <option value="oregon"> OR </option>
                                    <option value="pennsylvania"> PA </option>
                                    <option value="rhodeIsland"> RI </option>
                                    <option value="southCarolina"> SC </option>
                                    <option value="southDakota"> SD </option>
                                    <option value="tennessee"> TN </option>
                                    <option value="texas"> TX </option>
                                    <option value="utah"> UT </option>
                                    <option value="vermont"> VT </option>
                                    <option value="virginia"> VA </option>
                                    <option value="washington"> WA </option>
                                    <option value="westVirginia"> WV </option>
                                    <option value="wisconsin"> WI </option>
                                    <option value="wyoming"> WY </option>
                                </select>
                            </div>
                            <div>
                                <label for="zip"> Zip </label>
                                <input type="num" name="zip" id="zip" class="flexrowShort" maxlength="5" autocomplete="postal-code" placeholder="12345" pattern="[0-9]{5}" data-message="Must be 5 digits" required>
                            </div>
                        </div>
                    </fieldset>
                    <fieldset id="contactInfo" class="formFieldset">
                        <legend> Contact Information </legend>
                        <label for="email"> Email </label>
                        <input type="email" name="email" id="email" class="inputBoxMedium" autocomplete="email" placeholder="sample@email.com" pattern="[A-Za-z._%+\-]+@[A-Za-z0-9.\-]+\.[a-zA-Z]{2,}$" required>

                        <label for="phone"> Phone Number </label>
                        <input type="tel" name="phone" id="phone" class="inputBoxMedium" autocomplete="tel" placeholder="1-444-555-6789" pattern="1-{1}[0-9]{3}-{1}[0-9]{3}-{1}[0-9]{4}" maxlength="14" required>
                    </fieldset>
                    <fieldset id="accountSecurity" class="formFieldset">
                        <legend> Account Security </legend>
                        <label for="passOG"> Password </label>
                        <input type="password" name="passOG" id="passOG" class="inputBoxMedium"  pattern="^.{8,}" autocomplete="new-password" data-message="Must be at least 8 characters" required>

                        <label for="passConfirm"> Confirm Password </label>
                        <input type="password" name="passConfirm" id="passConfirm" class="inputBoxMedium" autocomplete="new-password" pattern="^.{8,}" required>
                    </fieldset>
                    <button id="submitButton"> Submit </button>
                </form>
            </div>
        </main>
    </body>
</html>
