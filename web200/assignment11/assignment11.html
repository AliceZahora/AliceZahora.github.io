<!DOCTYPE html>
<html lang="en">
    <head>
        <!--
            Alice Zahora
            Class: Web 200
            Assignment: 11
            Date: 11/22/2026
        -->
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <meta name="description" content="Web 200 - Assignment 11">
        <link rel="stylesheet" href="assignment11.css" type="text/css">
        <script src="assignment11.js" defer></script>
        <title> Web 200 - Zahora 11 </title>
        <!--
            INSTRUCTIONS

            Build a registration or contact form with thorough client-side validation:
            required fields, email format, a password with minimum length and complexity,
            and a matching confirm-password field. Show clear, inline error messages next to
            each field — not alerts. Form should only "submit" (display a success message) when all validations pass.

            Include:

            First name
            last name
            phone #
            email
            address
            password
            confirm password

            use HTML placeholder text, inline alerts when validation fails
        -->
    </head>
    <body id="body">
        <header id="header">
            <h1> Web 200 </h1>
            <h2> Assignment 11 </h2>
        </header>
        <main id="main">
            <form method="post" id="fullForm">
                <fieldset id="personalInfo" class="formFieldset">
                    <legend> Personal Details </legend>
                    <div id="fullName">
                        <div>
                            <label for="fname"> First Name </label>
                            <input type="text" name="fname" id="fname" autocomplete="given-name" placeholder="John" pattern="[A-Za-z]" required>
                        </div>
                        <div>
                            <label for="middleInitial"> MI </label>
                            <input type="text" name="middleInitial" id="middleInitial" autocomplete="additional-name" placeholder="D" pattern="[A-Za-z]{1}" maxlength="1">
                        </div>
                        <div>
                            <label for="lname"> Last Name </label>
                            <input type="text" name="lname" id="lname" autocomplete="family-name" placeholder="Doe" pattern="[A-Za-z]" required>
                        </div>
                    </div>
                    <label for="addrLine"> Address </label>
                    <input type="text" name="addrLine" id="addrLine" class="inputBoxLong" autocomplete="address-line1" placeholder="123 Sample Street" required>
                    <div>
                        <label for="country"> Country </label>
                        <input type="text" name="country" id="country" class="inputBoxMedium" autocomplete="country" placeholder="Country" required>

                        <label for="city"> City </label>
                        <input type="text" name="city" id="city" class="inputBoxMedium" autocomplete="address-level2" placeholder="City" required>

                        <label for="state" hidden> State </label>
                        <select name="state" name="state" id="state" autocomplete="address-level1" hidden required>
                            <option value="alabama"> Alabama </option>
                            <option value="alaska"> Alaska </option>
                            <option value="arizona"> Arizona </option>
                            <option value="arkansas"> Arkansas </option>
                            <option value="california"> California </option>
                            <option value="colorado"> Colorado </option>
                            <option value="connecticut"> Connecticut </option>
                            <option value="delaware"> Delaware </option>
                            <option value="florida"> Florida </option>
                            <option value="georgia"> Georgia </option>
                            <option value="hawaii"> Hawaii </option>
                            <option value="idaho"> Idaho </option>
                            <option value="illinois"> Illinois </option>
                            <option value="indiana"> Indiana </option>
                            <option value="iowa"> Iowa </option>
                            <option value="kansas"> Kansas </option>
                            <option value="kentucky"> Kentucky </option>
                            <option value="louisiana"> Louisiana </option>
                            <option value="maine"> Maine </option>
                            <option value="maryland"> Maryland </option>
                            <option value="massachusetts"> Massachusetts </option>
                            <option value="michigan"> Michigan </option>
                            <option value="minnesota"> Minnesota </option>
                            <option value="mississippi"> Mississippi </option>
                            <option value="missouri"> Missouri </option>
                            <option value="montana"> Montana </option>
                            <option value="nebraska"> Nebraska </option>
                            <option value="nevada"> Nevada </option>
                            <option value="newHampshire"> New Hampshire </option>
                            <option value="newJersey"> New Jersey </option>
                            <option value="newMexico"> New Mexico </option>
                            <option value="newYork"> New York </option>
                            <option value="northCarolina"> North Carolina </option>
                            <option value="northDakota"> North Dakota </option>
                            <option value="ohio"> Ohio </option>
                            <option value="oklahoma"> Oklahoma </option>
                            <option value="oregon"> Oregon </option>
                            <option value="pennsylvania"> Pennsylvania </option>
                            <option value="rhodeIsland"> Rhode Island </option>
                            <option value="southCarolina"> South Carolina </option>
                            <option value="southDakota"> South Dakota </option>
                            <option value="tennessee"> Tennessee </option>
                            <option value="texas"> Texas </option>
                            <option value="utah"> Utah </option>
                            <option value="vermont"> Vermont </option>
                            <option value="virginia"> Virginia </option>
                            <option value="washington"> Washington </option>
                            <option value="westVirginia"> West Virginia </option>
                            <option value="wisconsin"> Wisconsin </option>
                            <option value="wyoming"> Wyoming </option>
                        </select>

                        <label for="zip"> Zip </label>
                        <input type="num" name="zip" id="zip" class="inputBoxShort" maxlength="5" autocomplete="postal-code" placeholder="12345" pattern="[0-9]{5}" required>
                    </div>
                </fieldset>
                <fieldset id="contactInfo" class="formFieldset">
                    <legend> Contact Information </legend>
                    <label for="email"> Email </label>
                    <input type="email" name="email" id="email" class="inputBoxMedium" autocomplete="email" placeholder="sample@email.com" pattern="[A-Za-z._%+\-]+@[A-Za-z0-9.\-]+\.[a-zA-Z]{2,}$" required>

                    <label for="phone"> Phone Number </label>
                    <input type="tel" name="phone" id="phone" class="inputBoxMedium" autocomplete="tel" placeholder="1-444-555-6789" pattern="[0-9]{1,3}+[0-9]{3,15}$" required>
                </fieldset>
                <fieldset id="accountSecurity" class="formFieldset">
                    <legend> Account Security </legend>
                    <label for="passOG"> Password </label>
                    <input type="password" name="passOG" id="passOG" class="inputBoxMedium" autocomplete="new-password" required>

                    <label for="passConfirm"> Confirm Password </label>
                    <input type="password" name="passConfirm" id="passConfirm" class="inputBoxMedium" autocomplete="new-password" pattern="^.{8,}" required>
                </fieldset>
            </form>
        </main>
    </body>
</html>
