<!DOCTYPE html>
<html lang="en">
    <head>
        <!--
            Alice Zahora
            Class: Web 200
            Assignment: Final Project
            Date: 11/15/2026
        -->
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <meta name="description" content="Web 200 - Final Project">
        <link rel="stylesheet" href="finalProject.css" type="text/css">
        <script src="finalProject.js" defer></script>
        <script src="https://kit.fontawesome.com/e558e0301a.js" crossorigin="anonymous"></script>
        <link rel="preconnect" href="https://fonts.googleapis.com">
        <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
        <link href="https://fonts.googleapis.com/css2?family=Montserrat:ital,wght@0,100..900;1,100..900&family=Roboto:ital,wght@0,100..900;1,100..900&display=swap" rel="stylesheet">
        <title> Web 200 - Zahora Final </title>
        <!--
            INSTRUCTIONS

            Create your Pizza page concept design:
            - Layout
            - At least 3 crust sizes (i.e. radio buttons)
            - At least 6 options for toppings (checkboxes... should be able to select or deselect options)
            - Form fields for customer information (name, email, phone, address, textbox for notes)
            - Place for order details to be displayed (# of pizzas, Prices, etc.)
        -->
    </head>
    <body id="body">
        <header id="header">
            <nav id="menu1" aria-label="accountLinks">
                <h1 id="brandName">
                    <a href=""> Its Za Pizza </a>
                </h1>
                <div id="rightMenu">
                    <a href=""> Rewards </a>
                    <a href=""> <i class="fa-solid fa-user"></i> Account </a>
                    <a href=""> <i class="fa-solid fa-cart-shopping"></i> Cart </a>
                </div>
            </nav>
            <nav id="menu2" aria-label="shopNavigation">
                <a href=""> MENU </a>
                <a href=""> START ORDER </a>
                <a href=""> TRACKING </a>
                <a href=""> DEALS </a>
            </nav>
        </header>
        <main id="main">
            <div id="bannerWrap">
                <img id="banner" src="images/pizzaBanner.jpg" alt="Pizza with one slice being taken">
            </div>
            <div id="content">
                <h2 id="buildHeader"> BUILD YOUR PIZZA </h2>
                <div id="buildArea">
                    <fieldset class="buildField">
                        <legend id="sizeLegend" class="buildLegend"> SIZE </legend>
                        <label for="sizeSmall" class="buildLabel">
                            <input type="radio" name="size" id="sizeSmall" value="small"> SMALL
                        </label>
                        <label for="sizeMedium" class="buildLabel">
                            <input type="radio" name="size" id="sizeMedium" value="medium"> MEDIUM
                        </label>
                        <label for="sizeLarge" class="buildLabel">
                            <input type="radio" name="size" id="sizeLarge" value="large"> LARGE
                        </label>
                    </fieldset>
                    <fieldset class="buildField">
                        <legend id="crustLegend" class="buildLegend"> CRUST </legend>
                        <label for="crustThin" class="buildLabel">
                            <input type="radio" name="crust" id="crustThin" value="thin"> THIN
                        </label>
                        <label for="crustNormal" class="buildLabel">
                            <input type="radio" name="crust" id="crustNormal" value="normal"> NORMAL
                        </label>
                        <label for="crustCheese" class="buildLabel">
                            <input type="radio" name="crust" id="crustCheese" value="cheese"> CHEESE
                        </label>
                        <label for="crustDeep" class="buildLabel">
                            <input type="radio" name="crust" id="crustDeep" value="deepDish"> DEEP DISH
                        </label>
                    </fieldset>
                    <fieldset class="buildField">
                        <legend id="sauceLegend" class="buildLegend"> SAUCE </legend>
                        <label for="sauceNone" class="buildLabel">
                            <input type="radio" name="sauce" id="sauceNone" value="none"> NONE
                        </label>
                        <label for="sauceLight" class="buildLabel">
                            <input type="radio" name="sauce" id="sauceLight" value="light"> LIGHT
                        </label>
                        <label for="sauceNormal" class="buildLabel">
                            <input type="radio" name="sauce" id="sauceNormal" value="normal"> NORMAL
                        </label>
                        <label for="sauceHeavy" class="buildLabel">
                            <input type="radio" name="sauce" id="sauceHeavy" value="heavy"> HEAVY
                        </label>
                    </fieldset>
                    <fieldset class="buildField">
                        <legend id="cheeseLegend" class="buildLegend"> CHEESE </legend>
                        <label for="cheeseNone" class="buildLabel">
                            <input type="radio" name="cheese" id="cheeseNone" value="none"> NONE
                        </label>
                        <label for="cheeseHalfLeft" class="buildLabel">
                            <input type="radio" name="cheese" id="cheeseHalfLeft" value="halfLeft"> 1/2 LEFT
                        </label>
                        <label for="cheeseHalfRight" class="buildLabel">
                            <input type="radio" name="cheese" id="cheeseHalfRight" value="halfRight"> 1/2 RIGHT
                        </label>
                        <label for="cheeseFull" class="buildLabel">
                            <input type="radio" name="cheese" id="cheeseFull" value="full"> FULL
                        </label>
                        <label for="cheeseExtra" class="buildLabel">
                            <input type="radio" name="cheese" id="cheeseExtra" value="extra"> EXTRA
                        </label>
                    </fieldset>
                    <fieldset class="toppingField">
                        <legend id="toppingLegend" class="buildLegend"> TOPPINGS </legend>
                        <div id="toppings1">
                            <label for="toppingCheddar" class="buildLabel cheeseImage">
                                <input type="checkbox" name="toppings" id="toppingCheddar" value="cheddar"> CHEDDAR
                            </label>
                            <label for="toppingMushrooms" class="buildLabel mushroomImage">
                                <input type="checkbox" name="toppings" id="toppingMushrooms" value="mushrooms"> MUSHROOMS
                            </label>
                            <label for="toppingPeppers" class="buildLabel peppersImage">
                                <input type="checkbox" name="toppings" id="toppingPeppers" value="peppers"> PEPPERS
                            </label>
                            <label for="toppingOlives" class="buildLabel olivesImage">
                                <input type="checkbox" name="toppings" id="toppingOlives" value="olives"> OLIVES
                            </label>
                        </div>
                        <div id="toppings2">
                            <label for="toppingPepperoni" class="buildLabel pepperoniImage">
                                <input type="checkbox" name="toppings" id="toppingPepperoni" value="pepperoni"> PEPPERONI
                            </label>
                            <label for="toppingSausage" class="buildLabel sausageImage">
                                <input type="checkbox" name="toppings" id="toppingSausage" value="sausage"> SAUSAGE
                            </label>
                            <label for="toppingBacon" class="buildLabel baconImage">
                                <input type="checkbox" name="toppings" id="toppingBacon" value="bacon"> BACON
                            </label>
                            <label for="toppingHam" class="buildLabel hamImage">
                                <input type="checkbox" name="toppings" id="toppingHam" value="ham"> HAM
                            </label>
                        </div>
                    </fieldset>
                    <button id="addToOrder" value="ADD TO ORDER" class="roundedButton" command="show-modal" commandFor="cartStatus"> ADD TO CART </button>
                </div>
            </div>
            <dialog id="cartStatus">
                <button id="closeCart" command="close" commandFor="cartStatus"> X </button>
                <div id="mainCart">
                    <h3 id="reviewCart"> REVIEW CART </h3>
                    <div class="cartItem">
                        <div class="pizzaImage">

                        </div>
                        <div class="nameAndNum">
                            <p class="pizzaName"> Sample Pizza </p>
                            <input type="number" id="pizza1Qty" class="pizzaQty" min="1" max="99" value="1">
                        </div>
                        <div class="deleteAndPrice">
                            <button class="deletePizza"> X </button>
                            <p class="pizzaPrice"> $2.99 </p>
                        </div>
                    </div>
                    <div id="cartSummary">
                        <div class="summaryDetails">
                            <p id="subtotalLabel"> SUBTOTAL </p>
                            <p id="subtotalAmount"> $2.99 </p>
                        </div>
                        <div class="summaryDetails">
                            <p id="shippingLabel"> SHIPPING </p>
                            <p id="shippingAmount"> $1.99 </p>
                        </div>
                        <div class="summaryDetails">
                            <p id="totalLabel"> TOTAL </p>
                            <p id="totalAmount"> $4.98 </p>
                        </div>
                    </div>
                    <div id="customerInfo">
                        <label for="custName"> Full Name
                            <input type="text" id="custName">
                        </label>
                        <label for="custEmail"> Email
                            <input type="email" id="custEmail">
                        </label>
                        <label for="custPhone"> Phone
                            <input type="tel" id="custTel">
                        </label>
                        <label for="custAddr"> Address
                            <input type="text" id="custAddr">
                        </label>
                        <label for="custNotes"> Additional Notes
                            <input type="textarea" id="custNotes">
                        </label>
                    </div>
                    <input type="button" value="CHECKOUT" id="checkoutButton">
                </div>
            </dialog>
        </main>
        <footer id="footer">
            <p> This is a fake website made for a Harper College final </p>
            <p> No AI was used </p>
        </footer>
    </body>
</html>
