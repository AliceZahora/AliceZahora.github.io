    <body id="body">
        <header id="header">

        <main id="main">
            <div id="allCakes">
                <h4 class="centerHeading"> Premade Cakes </h4>
                <p class="instructions"> Hover on card for details </p>
                <div id="premadeCakes">
                    <div class="wholeCard">
                        <div class="frontCard">
                            <div class="frosting">
                                <p class="message"></p>
                            </div>
                            <!-- wavy border from: https://css-generators.com/wavy-shapes/-->
                            <div class="frostingDrip wavy"></div>
                            <div class="flavor"></div>
                        </div>
                    </div>
                    <div class="wholeCard">
                        <div class="frontCard">
                            <div class="frosting">
                                <p class="message"></p>
                            </div>
                            <!-- wavy border from: https://css-generators.com/wavy-shapes/-->
                            <div class="frostingDrip wavy"></div>
                            <div class="flavor"></div>
                        </div>
                    </div>
                    <div class="wholeCard">
                        <div class="frontCard">
                            <div class="frosting">
                                <p class="message"></p>
                            </div>
                            <!-- wavy border from: https://css-generators.com/wavy-shapes/-->
                            <div class="frostingDrip wavy"></div>
                            <div class="flavor"></div>
                        </div>
                    </div>
                </div>
                <h4 class="centerHeading"> Make Your Own </h4>
                <div id="createCake">
                    <div class="customCard">
                        <div class="frosting">
                            <p class="message"> Sample Text </p>
                        </div>
                        <!-- wavy border from: https://css-generators.com/wavy-shapes/-->
                        <div class="frostingDrip wavy"></div>
                        <div class="flavor"></div>
                    </div>
                    <div id="customControls">
                        <div id="col1">
                            <fieldset>
                                <legend> Size </legend>
                                <label for="small">
                                <input type="radio" name="sizes" id="small" value="small"> Small
                                </label>
                                <label for="medium">
                                <input type="radio" name="sizes" id="medium" value="medium"> Medium
                                </label>
                                <label for="large">
                                <input type="radio" name="sizes" id="large" value="large"> Large
                                </label>
                            </fieldset>
                            <fieldset>
                                <legend> Layers </legend>
                                <label for="1layer">
                                <input type="radio" name="layers" id="1layer" value="1"> 1
                                </label>
                                <label for="2layer">
                                <input type="radio" name="layers" id="2layer" value="2"> 2
                                </label>
                                <label for="3layer">
                                <input type="radio" name="layers" id="3layer" value="3"> 3
                                </label>
                            </fieldset>
                            <fieldset>
                                <legend> Flavor </legend>
                                <label for="chocoFlav">
                                <input type="radio" name="flavor" id="chocoFlav" value="chocolate"> Chocolate
                                </label>
                                <label for="vanillaFlav">
                                <input type="radio" name="flavor" id="vanillaFlav" value="vanilla"> Vanilla
                                </label>
                                <label for="redFlav">
                                <input type="radio" name="flavor" id="redFlav" value="redVelvet"> Red Velvet
                                </label>
                            </fieldset>
                        </div>
                        <div id="col2">
                            <fieldset>
                                <legend> Frosting </legend>
                                <label for="chocoFrost">
                                <input type="radio" name="frosting" id="chocoFrost" value="chocolate"> Chocolate
                                </label>
                                <label for="vanillaFrost">
                                <input type="radio" name="frosting" id="vanillaFrost" value="vanilla"> Vanilla
                                </label>
                                <label for="lemonFrost">
                                <input type="radio" name="frosting" id="lemonFrost" value="lemon"> Lemon
                                </label>
                            </fieldset>
                            <fieldset>
                                <legend> Message </legend>
                                <input type="text">
                            </fieldset>
                        </div>
                    </div>
                </div>
            </div>
        </main>
